# pnpm 10+ blocks dependency install scripts by default; state them explicitly.
# esbuild — tsdown's underlying bundler; without its binary the build fails
# outright, so it must be allowed.
allowBuilds:
  esbuild: true
  node-pty: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-locale@0.2.0-rc.1'
