# dsh-todo-sidebar bundle patch
#
# Assembly layer for the DSH profiles whose bundle list includes this package.
# A pure ADDITION: one insert row carrying an id no shipped entry uses. No
# shipped row is disabled, renamed, or reconfigured here, so the patch stays
# safe to compose with any other plugin's patch.
#
# The row exists only so the loader has a host-side entry point; every
# behaviour of this plugin lives in the browser half (see src/index.ts).
#
# Install (recommended, official CLI):
#   dsh plugin --profile <profile> add <dsh-todo-sidebar-0.1.0.tgz>
#
# Both routes are mutually exclusive - do not end up with the row twice.

- insert:
    - id: dsh-todo-sidebar
      name: dsh-todo-sidebar
